<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Xnet</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
  <!-- Gun + SEA loaded locally so the service worker can cache them for offline boot. -->
  <script src="/vendor/gun.js"></script>
  <script src="/vendor/sea.js"></script>
</head>
<body>
  <div id="app">
    <!-- AUTH ------------------------------------------------------------ -->
    <div id="auth" class="screen">
      <div class="auth-card">
        <h1 class="brand">Xnet</h1>
        <p class="tagline">Encrypted chat that keeps working when the server doesn't.</p>

        <div class="tabs">
          <button class="tab active" data-tab="login">Log in</button>
          <button class="tab" data-tab="signup">Sign up</button>
        </div>

        <form id="form-login" class="auth-form">
          <input name="alias" placeholder="username" autocomplete="username" />
          <input name="pass" type="password" placeholder="passphrase" autocomplete="current-password" />
          <button type="submit" class="primary">Log in</button>
        </form>

        <form id="form-signup" class="auth-form hidden">
          <input name="displayName" placeholder="display name" />
          <input name="alias" placeholder="username (a-z, 0-9, _)" autocomplete="username" />
          <input name="pass" type="password" placeholder="passphrase" autocomplete="new-password" />
          <button type="submit" class="primary">Create account</button>
          <p class="hint">No email, no phone. Your passphrase derives your keys —
            keep it safe, and export your keypair once you're in.</p>
        </form>

        <div class="auth-alt">
          <button id="import-key" class="link">Import a keypair file…</button>
          <input id="import-file" type="file" accept="application/json" hidden />
        </div>

        <p id="auth-error" class="error"></p>
      </div>
    </div>

    <!-- MAIN ------------------------------------------------------------ -->
    <div id="main" class="hidden">
      <aside id="sidebar">
        <header class="side-header">
          <div class="me">
            <span class="avatar" id="me-avatar"></span>
            <div>
              <div class="me-name" id="me-name"></div>
              <div class="me-alias" id="me-alias"></div>
            </div>
          </div>
          <button id="menu-btn" class="icon-btn" title="Menu">⋯</button>
          <div id="menu" class="menu hidden">
            <button id="export-key">Export keypair</button>
            <button id="logout">Log out</button>
          </div>
        </header>

        <div class="search">
          <input id="search-input" placeholder="Find someone by username…" />
          <div id="search-results" class="search-results"></div>
        </div>

        <div class="list-section">
          <div class="list-title">
            <span>Rooms</span>
            <button id="new-room" class="icon-btn" title="New room">+</button>
          </div>
          <ul id="room-list" class="conv-list"></ul>
        </div>

        <div class="list-section">
          <div class="list-title"><span>Direct messages</span></div>
          <ul id="dm-list" class="conv-list"></ul>
        </div>
      </aside>

      <section id="chat">
        <div id="chat-empty" class="empty">
          <p>Select a conversation, or search for someone to start chatting.</p>
        </div>

        <div id="chat-active" class="hidden">
          <header class="chat-header">
            <button id="back-btn" class="icon-btn mobile-only">‹</button>
            <div class="chat-title" id="chat-title"></div>
            <button id="chat-menu-btn" class="icon-btn" title="Conversation menu">⋯</button>
            <div id="chat-menu" class="menu hidden"></div>
          </header>

          <div id="messages" class="messages"></div>

          <form id="composer" class="composer">
            <button type="button" id="attach-btn" class="icon-btn" title="Attach file">📎</button>
            <input id="attach-file" type="file" hidden />
            <textarea id="composer-input" rows="1" placeholder="Message — Markdown supported"></textarea>
            <button type="submit" class="primary send">Send</button>
          </form>
        </div>
      </section>
    </div>

    <!-- Connection / offline banner -->
    <div id="net-banner" class="net-banner hidden"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
